name: E2E

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e:
    name: End-to-end (real CLI + real server)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: "E2E suite (offline CLI and HTTP server, no API key)"
        run: pytest tests/test_e2e.py -v

      - name: "Live agent E2E (only if a key is configured)"
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        env:
          EDARKCODE_E2E_LLM: "1"
          EDARKCODE_LLM__API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDARKCODE_LLM__MODEL: gpt-4o-mini
        run: pytest tests/test_e2e.py::test_live_agent_creates_a_file -v

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.os }}
          path: |
            .edarkcode-e2e/
          if-no-files-found: ignore
